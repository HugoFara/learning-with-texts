name: Psalm Static Analysis

# Pull requests run what the change can affect; a push to main runs everything.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'psalm.xml'
      - '.github/workflows/security_check.yml'

# A new push to a pull request replaces the run in progress. Runs on main are
# left to finish: they are the last full check before a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  psalm:
    name: Psalm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, dom

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-psalm-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-psalm-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Create node_modules directory
        run: mkdir -p node_modules

      - name: Run Psalm
        run: vendor/bin/psalm --output-format=github
