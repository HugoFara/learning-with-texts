name: PHP CodeSniffer

# Pull requests run what the change can affect; a push to main runs everything.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.php'
      - 'phpcs.xml'
      - '.github/workflows/phpcs.yml'

# A new push to a pull request replaces the run in progress. Runs on main are
# left to finish: they are the last full check before a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpcs:
    name: PHP CodeSniffer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: cs2pr, phpcs

      - name: Run PHP CodeSniffer
        # --warning-severity=0 ignores warnings (PSR-12 side-effects in view files)
        run: phpcs --standard=PSR12 --extensions=php --ignore=vendor/,node_modules/,docs/ --warning-severity=0 src/ --report=checkstyle | cs2pr
