name: Add Docker images to release

on:
  release:
    types: [ published ]
  push:
    tags:
       # Release attempt
      - '*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-upload-image-to-release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # For platform support change, change here and below.
        # Only platforms published by the php base image are buildable (it has
        # no arm/v5, mips64le or s390x manifest — those legs fail with
        # "no match for platform in manifest", see HugoFara/lwt release CI).
        # php:8.4-apache-bookworm currently publishes: 386, amd64, arm, arm64,
        # ppc64le.
        platform:
          - linux/amd64
          - linux/386
          - linux/arm/v7
          - linux/arm64
          - linux/ppc64le
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build  Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=/tmp/image.tar
        if: ${{ github.event_name == 'release'}}

      - name: Upload binaries to release
        if: ${{ github.event_name == 'release'}}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{secrets.GITHUB_TOKEN }}
          file: /tmp/image.tar
          asset_name: ${{ github.ref_name }}-${{ matrix.platform }}
          tag: ${{ github.ref }}
